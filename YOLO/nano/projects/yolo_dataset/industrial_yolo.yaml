hsv_s: 0.7
hsv_v: 0.4
degrees: 5
translate: 0.1
scale: 0.5
shear: 2.0
perspective: 0.001
flipud: 0.0
fliplr: 0.3
mosaic: 1.0
mixup: 0.2
copy_paste: 0.3

