# INDUSTRIAL YOLOv12 CONFIGURATION
epochs: 200
batch: 64
imgsz: 640
optimizer: SGD
lr0: 0.01
lrf: 0.01
cos_lr: True
momentum: 0.937
weight_decay: 0.0005
label_smoothing: 0.05
device: 0
workers: 8
project: runs/train
name: industrial_yolo_train

